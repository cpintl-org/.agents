# ModelAdapter: WHICH AI provider and model to use. Change only this file to switch providers.
# Never write a password, key, or token here. credentialRef is only the NAME of a secret kept elsewhere.
apiVersion: agents.cpintl.org/v1alpha1
kind: ModelAdapter
metadata:
  name: manual-review-adapter
  owner: "{responsible-role}"
  description: "No AI. The task becomes a checklist for a person."
spec:
  provider: manual-review
  model: none
  capabilities:
    structuredOutput: false
    vision: false
    tools: false
  limits:
    contextTokens: "verify-at-runtime"
    outputTokens: "verify-at-runtime"
  verifiedOn: "{YYYY-MM-DD}"
  extensions: {}
