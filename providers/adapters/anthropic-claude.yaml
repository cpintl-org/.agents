apiVersion: agents.cpintl.org/v1alpha1
kind: ModelAdapter
metadata:
  name: anthropic-claude-adapter
  owner: "{responsible-role}"
  description: "Placeholder for Anthropic Claude. Verify model names, limits, and data-use terms first."
spec:
  provider: anthropic
  model: "{model-id}"
  credentialRef: "{approved-secret-name}"
  capabilities:
    structuredOutput: true
    vision: false
    tools: true
  limits:
    contextTokens: "verify-at-runtime"
    outputTokens: "verify-at-runtime"
  verifiedOn: "{YYYY-MM-DD}"
  extensions:
    providerSpecific:
      "{provider-field}": "{value}"
