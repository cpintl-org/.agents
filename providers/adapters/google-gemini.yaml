apiVersion: agents.cpintl.org/v1alpha1
kind: ModelAdapter
metadata:
  name: google-gemini-adapter
  owner: "Health Program Manager"
  description: "Production configuration for Google Gemini models (Gemini 2.0 Flash / Gemini 1.5 Pro) under CPI free-tier guardrails."
spec:
  provider: google
  model: gemini-2.0-flash
  credentialRef: GEMINI_API_KEY
  capabilities:
    structuredOutput: true
    vision: true
    tools: true
  limits:
    contextTokens: 1048576
    outputTokens: 8192
  verifiedOn: "2026-09-24"
  extensions:
    governance:
      restrictedDataPermitted: false
      patientDataPermitted: false
      cpiBrandCompliant: true
