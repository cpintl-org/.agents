apiVersion: agents.cpintl.org/v1alpha1
kind: ModelAdapter
metadata:
  name: openai-compatible-adapter
  owner: "{responsible-role}"
  description: "Any service that accepts OpenAI-compatible requests. Verify terms first."
spec:
  provider: openai-compatible
  model: "{model-id}"
  credentialRef: "{approved-secret-name}"
  capabilities:
    structuredOutput: true
    vision: false
    tools: true
  limits:
    contextTokens: "verify-at-runtime"
    outputTokens: "verify-at-runtime"
  verifiedOn: "{YYYY-MM-DD}"
  extensions:
    providerSpecific:
      "{provider-field}": "{value}"
