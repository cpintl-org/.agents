name: Validate agent skills

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: skill-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate skill packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      # The same scripts the local one-command check runs, so the two agree.
      - name: Validate skill metadata and bundled references
        run: python schemas/scripts/validate_skill_packages.py

      - name: Validate repository naming policy
        run: python skills/cpintl-org-writing-skill/scripts/validate_repo_naming.py

      - name: Validate CPI brand skill assets
        run: python skills/cpintl-org-brand/scripts/validate_brand_assets.py

      - name: Run bundled free-matrix checker
        run: python skills/google-workspace-free-serverless/scripts/verify_free_matrix.py skills/google-workspace-free-serverless/references/free-resource-matrix.md

      - name: Validate prompt templates and schemas
        run: python skills/prompt-authoring/scripts/validate_prompts.py prompts/library

      - name: Validate agent YAML templates and provider adapters
        run: python skills/agent-task-planning/scripts/validate_agent_yaml.py templates providers/adapters

      - name: Validate memory search request templates
        run: python skills/memory-search/scripts/validate_memory_request.py skills/memory-search/templates/memory-search-request.json

      - name: Validate bridge request fixture
        run: python skills/workspace-drive-search/scripts/validate_bridge_request.py skills/workspace-drive-search/references/example-request.json

      - name: Validate writing-skill bundled resources
        run: python skills/cpintl-org-writing-skill/scripts/validate_resources.py

      - name: Validate control panel CSVs against their schemas
        run: python schemas/scripts/validate_control_panel_csvs.py

      - name: Validate committed data files against their schemas
        run: python schemas/scripts/validate_data_against_schemas.py

      # JSON Schema legality, YAML/JSON parsing, secret scan, unsafe paths, and
      # the Workspace bridge safe defaults, in one shared script.
      - name: Run repository hygiene checks
        run: python schemas/scripts/validate_repo_hygiene.py

      - name: Run offline bridge behavioral tests
        run: node workspace-bridge/test-bridge.js

      - name: Check repository whitespace
        run: git diff --check
