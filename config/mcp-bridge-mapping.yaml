version: "1.1"
organization: "cpintl-org"
repository: ".agents"
defaultRef: "main"
status: draft
security:
  defaultMode: read-only
  allowWrite: false
  requireHumanApprovalForWrite: true
  preserveOpaqueIds: true
  encodeComponents: true
  redactSecrets: true
bridges:
  - id: brains-bridge
    repositoryPath: brains
    driveFolderId: "{drive-brains-folder-id}"
    drivePath: "AgenticHub/Brains"
    mode: read-only
  - id: skills-bridge
    repositoryPath: skills
    driveFolderId: "{drive-skills-folder-id}"
    drivePath: "AgenticHub/Skills"
    mode: read-only
  - id: guardrails-bridge
    repositoryPath: guardrails
    driveFolderId: "{drive-guardrails-folder-id}"
    drivePath: "AgenticHub/Guardrails"
    mode: read-only
  - id: templates-bridge
    repositoryPath: templates
    driveFolderId: "{drive-templates-folder-id}"
    drivePath: "AgenticHub/Templates"
    mode: read-only
  - id: memory-bridge
    repositoryPath: memory
    driveFolderId: "{drive-memory-folder-id}"
    drivePath: "AgenticHub/Memory"
    mode: read-only
