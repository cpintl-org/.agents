version: "1.0"
policyId: "cpintl-org-naming-001"
organization: "cpintl-org"
status: active
profiles:
  repository: "^[a-z0-9](?:[a-z0-9-]{0,98}[a-z0-9])?$"
  directory: "^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$"
  branch: "^(feat|fix|docs|chore|refactor|test|build|release)/[a-z0-9][a-z0-9-]{0,62}$"
  tag: "^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$"
  environmentVariable: "^[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)*$"
  mcpTool: "^[a-z][a-z0-9_]{0,127}$"
  portablePath: "^[a-z0-9][a-z0-9._-]{0,62}$"
reservedNames: [CON, PRN, AUX, NUL, COM1, LPT1]
rules:
  lowercasePortableNames: true
  rejectControlCharacters: true
  rejectPathTraversal: true
  rejectTrailingSpacesOrPeriods: true
  rejectCaseOnlyCollisions: true
  preserveOpaqueProviderIds: true
  encodeUriComponentsIndependently: true
  forbidSecretsInNamesAndExamples: true
  repositoryNameMustNotStartWithDot: true
mainOnly:
  defaultBranch: main
  permanentBranches: [main]
  temporaryBranchPolicy: "Delete after merge or close; do not treat as a release channel."
# Names a platform dictates. These are not exceptions to our rules; they are
# provider rules, which always win (see writing-skill principle 7).
providerRequiredNames:
  - name: ".github"
    scope: "organization profile repository"
    reason: "GitHub requires this exact name for organization-wide profile and default files."
fileConventions:        # documented now; not yet enforced by the checker
  toolRequired: [README.md, AGENTS.md, SKILL.md, LICENSE, SECURITY.md, CONTRIBUTING.md, CHANGELOG.md]
  appsScript: ["Code.gs", "appsscript.json", "clasp.json"]
  python: "snake_case.py"
  documentsOutsideGit: "CPI-BGD-{ProgramCode}-{DocumentType}-{YYYYMM}-v{Version}.{ext}"
standards:
  verifiedOn: "UNVERIFIED"   # fill after checking each official page; do not guess
  toCheck: [github, google-drive, agent-skills, agents-md, mcp, a2a, rfc-8615]
exceptions: []
review:
  requiredFields: [ownerRole, provider, visibility, sensitivity, lifecycle, exceptionStatus]
