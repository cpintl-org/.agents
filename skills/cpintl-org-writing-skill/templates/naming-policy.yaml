version: "1.0"
policyId: "cpintl-org-NAMING-001"
organization: "cpintl-org"
status: draft
owner: "{responsible-role}"
profiles:
  repository: "^[a-z0-9](?:[a-z0-9-]{0,98}[a-z0-9])?$"
  slug: "^[a-z][a-z0-9-]{0,62}$"
  branch: "^(feat|fix|docs|chore|refactor|test|build|release)/[a-z0-9][a-z0-9-]{0,62}$"
  tag: "^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?$"
  environmentVariable: "^[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)*$"
  mcpTool: "^[A-Za-z][A-Za-z0-9_.-]{0,127}$"
  portablePath: "^[a-z0-9][a-z0-9._-]{0,62}$"
reservedNames:
  - CON
  - PRN
  - AUX
  - NUL
  - COM1
  - LPT1
rules:
  lowercasePortableNames: true
  rejectControlCharacters: true
  rejectPathTraversal: true
  rejectTrailingSpacesOrPeriods: true
  rejectCaseOnlyCollisions: true
  preserveOpaqueProviderIds: true
  encodeUriComponentsIndependently: true
  forbidSecretsInNamesAndExamples: true
# The rule behind this table: org/repo/category/specific-thing.extension.
# `category` is the top-level folder; `extension` must match the file's actual
# format, never its subject. See references/uri-naming-standard.md for the
# full decision table and worked examples this mirrors.
categoryExtensions:
  brains: [".md"]
  skills: ["SKILL.md", ".md"]
  prompts: [".prompt"]
  schemas: [".schema.json"]
  templates: [".yaml", ".csv", ".json", ".md"]
  memory: [".schema.json", ".json", ".md"]
  providers: [".yaml"]
  evaluation: [".schema.json", ".json", ".md", ".yaml"]
  docs: [".md"]
  plans: [".yaml", ".md"]
  config: [".yaml"]
  scripts: [".py", ".sh", ".gs", ".js"]
  workspace-bridge: [".gs", ".json", ".md"]
  workflows: [".yml"]
providerExceptions: []
review:
  requiredFields:
    - owner
    - provider
    - visibility
    - sensitivity
    - lifecycle
    - exceptionStatus